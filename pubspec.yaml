name: bloom
description: Bloom — a warm, playful health, fitness, nutrition and wellness companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  local_auth: ^2.3.0
  pdf: ^3.11.3
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito-400.ttf
          weight: 400
        - asset: assets/fonts/nunito-600.ttf
          weight: 600
        - asset: assets/fonts/nunito-700.ttf
          weight: 700
        - asset: assets/fonts/nunito-800.ttf
          weight: 800
